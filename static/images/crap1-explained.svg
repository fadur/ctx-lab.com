<svg viewBox="0 0 760 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
  <title id="title">The CRAP1 formula</title>
  <desc id="desc">CRAP1 equals complexity squared multiplied by one minus coverage cubed, plus complexity.</desc>

  <rect width="760" height="190" fill="#fbfaf7"/>
  <line x1="32" y1="28" x2="728" y2="28" stroke="#1b1b1b" stroke-width="1.5"/>

  <text x="380" y="92" fill="#1b1b1b" font-size="23" text-anchor="middle">
    CRAP1 = C² × (1 − coverage)³ + C
  </text>

  <text x="380" y="130" fill="#6b6b6b" font-size="12" text-anchor="middle">
    C = cyclomatic complexity · coverage = 0 to 1
  </text>

  <line x1="32" y1="158" x2="728" y2="158" stroke="#1b1b1b" stroke-width="1.5"/>
</svg>
